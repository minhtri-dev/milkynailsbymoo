stages:
  - install
  - lint
  - build

variables:
  NODE_VERSION: '22'

default:
  image: node:${NODE_VERSION}
  before_script:
    - npm ci

install_dependencies:
  stage: install
  script:
    - echo "Dependencies installed"
  tags:
    - frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

lint:
  stage: lint
  script:
    - npm run lint
  tags:
    - frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build:
  stage: build
  script:
    - npm run build
  tags:
    - frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
