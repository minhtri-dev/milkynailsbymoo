stages:
  - install
  - lint
  - build

variables:
  NODE_VERSION: '22'

default:
  image: node:${NODE_VERSION}
  before_script:
    - npm ci

install_dependencies:
  stage: install
  script:
    - echo "Dependencies installed"
  tags:
    - frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

lint:
  stage: lint
  script:
    - npm run lint
  tags:
    - frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build:
  stage: build
  script:
    - npm run build
  tags:
    - frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

upload to s3:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  script:
    - aws s3 sync ./s3bucket s3://"$S3_BUCKET" --sse AES256 --delete
  only:
    refs:
      - main
    changes:
      - "out/**/*"

cache invalidation:
  stage: clean
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  script:
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT" --paths "/*"
  needs: ["upload to s3"]
  only:
    refs:
      - main
    changes:
      - "out/**/*"
